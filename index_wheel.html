<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1f8; --ink:#2a2638; --muted:#6d6882; --card:#ffffff; --line:#dcd8e8;
  --pink:#f0558f; --pink-soft:#fde0ec; --blue:#2f8bf0; --blue-soft:#dcebfd;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1828; --ink:#f1eefb; --muted:#a39db9; --card:#262238; --line:#3b3553;
    --pink-soft:#4a2437; --blue-soft:#1f3552;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1828; --ink:#f1eefb; --muted:#a39db9; --card:#262238; --line:#3b3553;
  --pink-soft:#4a2437; --blue-soft:#1f3552;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:22px 18px 60px}
h1{font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1;margin:6px 0 8px;letter-spacing:-.02em}
h1 .p{color:var(--pink)} h1 .b{color:var(--blue)}
.sub{color:var(--muted);margin:0 0 22px;font-size:17px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
.panel h2{font-size:18px;margin:0 0 10px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 150px;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pick{display:flex;gap:8px;flex:1 1 100%}
.pick button{flex:1;font:inherit;font-weight:800;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pick button.pk.on{background:var(--pink);border-color:var(--pink);color:#fff}
.pick button.bl.on{background:var(--blue);border-color:var(--blue);color:#fff}
.add,.go{flex:1 1 100%;font:inherit;font-weight:800;font-size:16px;padding:13px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:14px;font-weight:500;padding:5px 11px;border-radius:99px}
.chip.pk{background:var(--pink-soft);color:var(--pink)} .chip.bl{background:var(--blue-soft);color:var(--blue)}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.go{margin-top:14px}

#stage{display:none;text-align:center}
.wheelwrap{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:18px auto 8px}
#wheel{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 8px 30px rgba(40,30,70,.25);transform:rotate(0deg)}
.pointer{position:absolute;left:50%;top:-14px;width:0;height:0;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--ink);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.hub{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--card);border:4px solid var(--ink);z-index:1}
#msg{min-height:56px;font-size:20px;font-weight:800;margin:14px 0 6px}
#spin{font:inherit;font-weight:800;font-size:20px;padding:15px 40px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
#spin:disabled{opacity:.45;cursor:default}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}

#reveal{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;z-index:5;background:var(--pink)}
#reveal.show{display:flex;animation:pop .6s ease-out}
#reveal.boy{background:var(--blue)}
#reveal h2{font-size:clamp(54px,18vw,120px);font-weight:800;margin:0;line-height:.95;letter-spacing:-.03em}
#reveal p{font-size:20px;margin:14px 0 0;max-width:420px}
#reveal .win{margin-top:16px;font-size:17px;max-width:420px;background:rgba(255,255,255,.2);padding:12px 16px;border-radius:14px}
#reveal button{margin-top:22px;font:inherit;font-weight:800;font-size:16px;padding:12px 22px;border-radius:99px;border:0;background:#fff;color:#2a2638;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
canvas#cv{position:fixed;inset:0;pointer-events:none;z-index:6}
.host{text-align:center;margin-top:26px}
.host button{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){#reveal.show{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Boy or <span class="p">girl</span>?<br>Spin the <span class="b">wheel</span>.</h1>
  <p class="sub">Everyone's guess goes on the wheel. Spin to find out.</p>

  <section class="panel" id="setup">
    <h2>Add your guess</h2>
    <div class="row">
      <input type="text" id="name" placeholder="Your name" maxlength="24" autocomplete="off" aria-label="Your name">
      <div class="pick">
        <button class="pk" data-g="girl" type="button">Girl</button>
        <button class="bl" data-g="boy" type="button">Boy</button>
      </div>
      <button class="add" id="addGuess" type="button">Put me on the wheel</button>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
    <p class="hint" id="hint">Pass the phone around, then build the wheel.</p>
    <button class="go" id="build" type="button">Build the wheel</button>
    <button class="go" id="shareBtn" type="button" style="margin-top:10px;background:var(--card);color:var(--ink);border:2px solid var(--line)">Copy share link</button>
  </section>

  <section id="stage">
    <div class="wheelwrap">
      <div class="pointer"></div>
      <canvas id="wheel" aria-label="Prediction wheel"></canvas>
      <div class="hub"></div>
    </div>
    <div id="msg" aria-live="polite">Ready when you are.</div>
    <button id="spin" type="button">Spin</button>
  </section>

  <div class="host">
    <input type="text" id="shareUrl" readonly aria-label="Share link" style="display:none;width:100%;margin-bottom:8px;font-size:13px">
    <div id="shareNote" class="hint" aria-live="polite"></div>
    <button id="shareBtn2" type="button">Copy share link</button> &nbsp;·&nbsp; <button id="reset" type="button">Start over</button>
  </div>
</main>

<div id="reveal" role="dialog" aria-live="assertive">
  <h2 id="rTitle"></h2>
  <p id="rSub"></p>
  <div class="win" id="rWin"></div>
  <button id="rClose" type="button">Back to the wheel</button>
</div>
<canvas id="cv"></canvas>

<script>
/* ===== HOST SETTING: change this line ===== */
var ANSWER = "boy";   // "boy" or "girl"
/* ========================================== */

var $ = function(id){return document.getElementById(id)};
var guesses = [], pick = null, segs = [], spins = 0, rot = 0, busy = false, lastLine = -1;
var COLORS = {girl:"#f0558f", boy:"#2f8bf0"};

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function addGuessChip(name, g){
  guesses.push({name:name, g:g});
  var chip = document.createElement("span");
  chip.className = "chip " + (g === "boy" ? "bl" : "pk");
  chip.textContent = name + ": " + g;
  $("chips").appendChild(chip);
}

/* share: guesses go into the link as ?p=Name|g or ?p=Name|b (the answer is never in the link) */
function baseUrl(){ return location.href.split(/[?#]/)[0]; }
function shareLink(){
  var note = $("shareNote");
  if(!guesses.length){ note.textContent = "Add some guesses first."; return; }
  var q = new URLSearchParams();
  guesses.forEach(function(x){ q.append("p", x.name + "|" + (x.g === "boy" ? "b" : "g")); });
  var url = baseUrl() + "?" + q.toString();
  var inp = $("shareUrl"); inp.value = url; inp.style.display = "block";
  function manual(){ inp.focus(); inp.select(); note.textContent = "Select and copy the link above."; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ note.textContent = "Link copied. Open it on any device to load these guesses."; }, manual);
  } else manual();
}
$("shareBtn").addEventListener("click", shareLink);
$("shareBtn2").addEventListener("click", shareLink);

document.querySelectorAll(".pick button").forEach(function(b){
  b.addEventListener("click", function(){
    pick = b.dataset.g;
    document.querySelectorAll(".pick button").forEach(function(x){ x.classList.toggle("on", x === b); });
  });
});
$("addGuess").addEventListener("click", function(){
  var name = $("name").value.trim();
  if(!name){ $("hint").textContent = "Type your name first."; $("name").focus(); return; }
  if(!pick){ $("hint").textContent = "Choose Girl or Boy."; return; }
  addGuessChip(name, pick);
  $("name").value = ""; pick = null;
  document.querySelectorAll(".pick button").forEach(function(x){ x.classList.remove("on"); });
  $("hint").textContent = "Added. Next person, or build the wheel.";
});

function buildWheel(){
  segs = guesses.map(function(x){ return {label:x.name, g:x.g, own:true}; });
  /* alternate colors where possible so lines are easy to see */
  var pk = shuffle(segs.filter(function(s){return s.g === "girl"})), bl = shuffle(segs.filter(function(s){return s.g === "boy"})), out = [];
  while(pk.length || bl.length){ if(pk.length) out.push(pk.pop()); if(bl.length) out.push(bl.pop()); }
  segs = out;
  spins = 0; rot = 0; lastLine = -1; busy = false;
  var c = $("wheel"); c.style.transition = "none"; c.style.transform = "rotate(0deg)";
  draw();
  $("setup").style.display = "none"; $("stage").style.display = "block";
  $("msg").textContent = "Ready when you are."; $("spin").disabled = false; $("spin").textContent = "Spin";
  updateDots();
}
$("build").addEventListener("click", function(){
  if(guesses.length < 2){ $("hint").textContent = "Add at least 2 guesses to build the wheel."; return; }
  buildWheel();
});

function draw(){
  var c = $("wheel"), size = c.clientWidth || 380, dpr = window.devicePixelRatio || 1;
  c.width = size * dpr; c.height = size * dpr;
  var x = c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  var r = size/2, n = segs.length, a = 2*Math.PI/n;
  x.clearRect(0,0,size,size);
  segs.forEach(function(s,i){
    var a0 = -Math.PI/2 + i*a, a1 = a0 + a;
    x.beginPath(); x.moveTo(r,r); x.arc(r,r,r-2,a0,a1); x.closePath();
    x.fillStyle = COLORS[s.g]; x.fill();
    x.lineWidth = 3; x.strokeStyle = "#fff"; x.stroke();
    x.save(); x.translate(r,r); x.rotate(a0 + a/2); x.textAlign = "right"; x.textBaseline = "middle";
    x.fillStyle = "#fff"; x.font = "800 " + Math.max(13, Math.min(20, size/(n > 10 ? 22 : 17))) + "px 'Bricolage Grotesque',system-ui,sans-serif";
    var t = s.label.length > 12 ? s.label.slice(0,11) + "…" : s.label;
    x.fillText(t, r - 22, 0); x.restore();
  });
}
window.addEventListener("resize", function(){ if(segs.length) draw(); });

function updateDots(){
  var d = document.querySelectorAll(".dots i");
  d.forEach(function(el,i){ el.classList.toggle("on", i < spins); });
}

/* angle on the wheel (degrees clockwise from top) that sits under the pointer */
function spinTo(angleDeg, ms, done){
  var cur = ((rot % 360) + 360) % 360;
  var need = (((-angleDeg - cur) % 360) + 360) % 360;
  rot = rot + 360*6 + need;
  var c = $("wheel");
  c.style.transition = "transform " + ms + "ms cubic-bezier(.1,.7,.1,1)";
  c.style.transform = "rotate(" + rot + "deg)";
  setTimeout(done, ms + 150);
}

$("spin").addEventListener("click", function(){
  if(busy || spins >= 3) return;
  busy = true; $("spin").disabled = true;
  var n = segs.length, step = 360/n, reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var ms = reduce ? 600 : 5200;
  $("msg").textContent = "Spinning…";
  if(spins < 2){
    var j; do { j = Math.floor(Math.random()*n); } while(j === lastLine);
    lastLine = j;
    spinTo(j*step, ms, function(){
      spins++; updateDots(); busy = false; $("spin").disabled = false;
      $("msg").textContent = spins === 1 ? "Right on the line! Too close to call. Spin again." : "On the line again! Give it another go.";
      $("spin").textContent = "Spin again";
    });
  } else {
    var cands = []; segs.forEach(function(s,i){ if(s.g === ANSWER) cands.push(i); });
    if(!cands.length) segs.forEach(function(s,i){ cands.push(i); });
    var k = cands[Math.floor(Math.random()*cands.length)];
    spinTo(k*step + step/2 + (Math.random()-.5)*step*.5, reduce ? 600 : 7200, function(){
      spins++; updateDots(); busy = false;
      $("msg").textContent = "";
      $("spin").textContent = "Spin"; $("spin").disabled = true;
      setTimeout(function(){ showReveal(segs[k]); }, 500);
    });
  }
});

function showReveal(seg){
  var boy = ANSWER === "boy", r = $("reveal");
  r.className = "show" + (boy ? " boy" : "");
  $("rTitle").textContent = boy ? "It's a boy!" : "It's a girl!";
  $("rSub").textContent = seg.g === ANSWER ? seg.label + " called it." : "The wheel has spoken.";
  var right = guesses.filter(function(x){return x.g === ANSWER}).map(function(x){return x.name});
  var w = $("rWin");
  if(!guesses.length){ w.style.display = "none"; }
  else { w.style.display = "block"; w.textContent = right.length ? "Guessed right: " + right.join(", ") : "Nobody guessed right. Surprise!"; }
  confetti(boy ? ["#ffffff","#bcdcff","#2f8bf0"] : ["#ffffff","#ffd0e3","#f0558f"]);
}
$("rClose").addEventListener("click", function(){ $("reveal").className = ""; });
$("reset").addEventListener("click", function(){
  guesses = []; $("chips").innerHTML = ""; $("hint").textContent = "Pass the phone around, then build the wheel.";
  $("shareUrl").style.display = "none"; $("shareNote").textContent = "";
  try { history.replaceState(null, "", baseUrl()); } catch(e) {}
  $("stage").style.display = "none"; $("setup").style.display = "block"; $("reveal").className = "";
});

/* load shared guesses from the link */
(function(){
  var ps;
  try { ps = new URLSearchParams(location.search).getAll("p").slice(0, 60); } catch(e) { return; }
  ps.forEach(function(v){
    var i = v.lastIndexOf("|");
    if(i < 1) return;
    var name = v.slice(0, i).trim().slice(0, 24), t = v.slice(i + 1);
    if(!name || (t !== "b" && t !== "g")) return;
    addGuessChip(name, t === "b" ? "boy" : "girl");
  });
  if(guesses.length >= 2) buildWheel();
  else if(guesses.length) $("hint").textContent = "Loaded " + guesses.length + " guess. Add more, then build the wheel.";
})();

function confetti(cols){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var cv = $("cv"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  var ps = [], i;
  for(i=0;i<160;i++) ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,w:6+Math.random()*7,h:10+Math.random()*8,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%cols.length]});
  var t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
    if(t - t0 < 6500) requestAnimationFrame(frame); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
</script>
</body>
</html>
